  <script>
    let marketStage = 1;
    const markets = [
      { question: 'ما هو السوق العماني التقليدي الأكثر شهرة؟', answer: 'سوق مطرح' },
      { question: 'أي سوق مشهور في مدينة نزوى؟', answer: 'سوق نزوى' }
    ];

    function loadMarketQuestion() {
      const market = markets[marketStage - 1];
      document.getElementById('market-question').textContent = market.question;
      document.getElementById('market-stage').textContent = marketStage;
    }
